        function selectText(event) {

            document.getElementById("dbLOBStorageTextId").style.display = "none";

        }

        initTexts();

        function dragElement(element) {
            var   mouseDown; // remember mouse down info
            const left  = document.getElementById("leftId");
            const right = document.getElementById("rightId");

            element.onmousedown = onMouseDown;

            function onMouseDown(e) {
                //console.log("mouse down: " + e.clientX);
                mouseDown = {e,
                    offsetLeft:  element.offsetLeft,
                    offsetTop:   element.offsetTop,
                    leftWidth:  left.offsetWidth,
                    rightWidth: right.offsetWidth
                };

                document.onmousemove = onMouseMove;
                document.onmouseup = function(e) {
                    //console.log("mouse up");
                    document.onmousemove = document.onmouseup = null;
                }
            }

            function onMouseMove(e) {
                //console.log("mouse move: " + e.clientX);
                var delta = {
                    x: e.clientX - mouseDown.e.clientX,
                    y: e.clientY - mouseDown.e.clientY
                };
                // Prevent negative-sized elements
                delta.x = Math.min(Math.max(delta.x, -mouseDown.leftWidth), mouseDown.rightWidth);

                element.style.left = mouseDown.offsetLeft + delta.x + "px";
                left.style.width = (mouseDown.leftWidth + delta.x) + "px";
                right.style.width = (mouseDown.rightWidth - delta.x) + "px";
            }
        }

        dragElement(document.getElementById("separator"));

        var toggler = document.getElementsByClassName("caret");
        for (var i = 0; i < toggler.length; i++) {
            toggler[i].addEventListener("click", function() {
                this.parentElement.querySelector(".nested").classList.toggle("active");
